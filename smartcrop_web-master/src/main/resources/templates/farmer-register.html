<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>SmartCorp</title>
    <meta content="" name="description">
    <meta content="" name="keywords">


    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&family=Roboto:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap"
          rel="stylesheet">


    <link href="assets/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.css" th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <link href="assets/css/all.min.css" th:href="@{/css/all.min.css}" rel="stylesheet">
    <link href="assets/css/aos.css" th:href="@{/css/aos.css}" rel="stylesheet">
    <link href="assets/css/glightbox.min.css" th:href="@{/css/glightbox.min.css}" rel="stylesheet">
    <link href="assets/css/swiper-bundle.min.css" th:href="@{/css/swiper-bundle.min.css}" rel="stylesheet">


    <link href="assets/css/main.css" th:href="@{/css/main.css}" rel="stylesheet">
    <script src="https://kit.fontawesome.com/b3be0b1cb8.js" crossorigin="anonymous"></script>
</head>

<body>

<section class="register-page employee-page">
    <div class="register-logo">
        <img src="assets/img/logo.png" th:src="@{/img/logo.png}" alt="SmartCorp">
        <h3>Farmer Onboarding Application</h3>
    </div>


    <div class="register-progress">
        <div class="progress-bar " role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
    </div>

    <div class="farmer-form">
        <form id="farmer_form" th:action="@{/farmer/registerFarmer}" th:object="${farmerModel}" method="POST"
              enctype="multipart/form-data">
            <fieldset id="1">

                <div class="form-field">

                    <h2>Farmer Information</h2>
                    <!-- <div class="back-to-login">
                         <p>Already have an account?<a th:href="@{/}"> Login</a></p>
                     </div>-->
                    <div class="form-input">
                        <label class="form-input ">
                            <label>Title<span class="astrick">*</span></label>
                            <select id="title" th:field="*{title}">
                                <option selected="" value="">Select</option>
                                <option value="Mr">Mr</option>
                                <option value="Ms">Ms</option>
                                <option value="Mrs">Mrs</option>
                                <option value="Dr">Dr</option>
                                <option value="Shree">Shree</option>
                            </select>
                            <span id="error-title" class="error"></span>
                            <span th:if="${#fields.hasErrors('title')}" th:errorclass="error" th:errors="*{title}"/>
                        </label>
                    </div>
                    <div>
                        <label class="form-input">
                            <label>First Name<span class="astrick">*</span></label>
                            <input type="text" id="fname" name="fname" th:field="*{firstName}">
                            <span id="error-fname" class="error"></span>
                            <span th:if="${#fields.hasErrors('firstName')}" th:errorclass="error"
                                  th:errors="*{firstName}"/>
                        </label>
                    </div>
                    <div>
                        <label class="form-input ">
                            <label>Middle Name</label>
                            <input type="text" id="mname" name="mname" th:field="*{middleName}">
                        </label>
                    </div>
                    <div>
                        <label class="form-input ">
                            <label>Last Name<span class="astrick">*</span></label>
                            <input type="text" id="lname" name="lname" th:field="*{lastName}">
                            <span id="error-lname" class="error"></span>
                            <span th:if="${#fields.hasErrors('lastName')}" th:errorclass="error"
                                  th:errors="*{lastName}"/>
                        </label>
                    </div>
                    <div>
                        <label class="form-input ">Gender<span class="astrick">*</span>
                            <select id="gender" required th:field="*{gender}">
                                <option value="" selected="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Prefer Not to Say">Prefer Not to Say</option>
                            </select>
                            <span id="error-gender" class="error"></span>
                        </label>
                    </div>
                    <div class="form-input">
                        <label>S/D/W of<span class="astrick">*</span></label>
                        <input th:field="*{careTaker}" type="text" name="" id="careTaker">
                        <span id="error-careTaker" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label class="astrick">Aadhaar Number</label>
                        <input th:field="*{aadharNumber}" type="number" name="" maxlength="12">
                    </div>
                    <div>
                        <label class="form-input">
                            <label class="astrick">Date of Birth<span class="astrick">*</span></label>
                            <input type="date" id="bdate" name="" placeholder="DD-MM-YYYY" th:field="*{dateOfBirth}">
                            <span id="error-bdate" class="error"></span>
                        </label>
                    </div>
                    <div class="form-input">
                        <label class="astrick">Caste<span class="astrick">*</span></label>
                        <select th:field="*{caste}">
                            <option value="OC">OC</option>
                            <option value="BC">BC</option>
                            <option value="ST">ST</option>
                            <option value="SC">SC</option>
                        </select>
                    </div>
                    <div class="form-input">
                        <label> Mobile Number<span class="astrick">*</span></label>
                        <input th:field="*{phoneNumber}" id="phone" type="number" name="">
                        <span id="error-phone" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label> Email</label>
                        <input th:field="*{email}" type="email" name="">
                    </div>

                </div>
                <div class="content-field">

                    <!--<img src="assets/img/user.png" th:src="@{/img/user.png}"
                         style="border-radius: 15px;max-width: 80%;margin:auto;">
                    <button>Upload Photo</button>
                    <button>Take a Photo</button>-->
                </div>

                <button type="button" onclick="showFieldset('2')" style="clear: both;float: right;">Next <i
                        class="fa-solid fa-chevron-right"></i></button>
            </fieldset>
            <!-- <fieldset id="2"  style="display:none">

               <div class="form-field">
                 <h2>Native Village Details</h2>
                 <div class="form-input">
                   <label> House Number </label>
                   <input th:field="*{nativeAddress.houseNumber}" type="text" name="">
                 </div>
                 <div class="form-input">
                   <label>PinCode</label>
                   <input th:field="*{nativeAddress.zipCode}" type="number" name="">
                 </div>
                 <div class="form-input">
                   <label>State</label>
                   <select th:field="*{nativeAddress.state}">
                     <option value="Rajasthan">Rajasthan</option>
                     <option value="Telangana">Telangana</option>
                   </select>
                 </div>
                 <div class="form-input">
                   <label>District</label>
                   <select th:field="*{nativeAddress.district}">
                     <option value="Anantapur">Anantapur</option>
                     <option value="Chittoor">Chittoor</option>
                   </select>
                 </div>
                 <div class="form-input">
                   <label> Mandal</label>
                   <select th:field="*{nativeAddress.mandal}">
                     <option value="Allapalli">Allapalli</option>
                     <option value="Aswapuram">Aswapuram</option>
                   </select>
                 </div>
                 <div class="form-input">
                   <label> Native Village</label>
                   <select th:field="*{nativeAddress.nativeVillage}">
                     <option value="Allapalli">Allapalli</option>
                     <option value="Aswapuram">Aswapuram</option>
                   </select>

               </div>

                 <img src="assets/img/why.jpg" style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 160px;">

             </fieldset>-->
            <fieldset id="2" style="display:none">

                <div class="form-field">
                    <h2>Plantation Village Details</h2>

                    <div class="form-input">
                        <label>Country<span class="astrick">*</span></label>
                        <select id="country" name="country" required th:field="*{proposedAreaCountry}"
                                onchange="loadStates()">
                            <option value="" selected="">Select</option>
                            <option th:each="country : ${countries}"
                                    th:value="${country.id}" th:text="${country.name}">
                            </option>

                        </select>
                        <span id="error-country" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>State<span class="astrick">*</span></label>
                        <select id="state" name="state" th:field="*{proposedAreaState}" onchange="loadDistricts()">
                        </select>
                        <span id="error-state" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>District<span class="astrick">*</span></label>
                        <select id="district" name="district" th:field="*{proposedAreaDistrict}"
                                onchange="loadMandals()">
                        </select>
                        <span id="error-district" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Mandal<span class="astrick">*</span></label>
                        <select id="mandal" name="mandal" th:field="*{proposedAreaMandal}" , onchange="loadVillages()">

                        </select>
                        <span id="error-mandal" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Revenue Village<span class="astrick">*</span></label>
                        <select id="village" name="village" th:field="*{proposedAreaVillage}">
                        </select>
                        <span id="error-village" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Zip Code<span class="astrick">*</span></label>
                        <input th:field="*{zipCode}" type="number" id="zip" name="zip" class="zip">
                        <span id="error-zip" class="error"></span>
                    </div>

                    <div class="form-input">
                        <label> Total Land Holding (Acres)<span class="astrick">*</span></label>
                        <input type="number" name="" id="totalLand" th:field="*{totalLandHoldingInAcres}">
                        <span id="error-totalLand" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Soil Type<span class="astrick">*</span></label>
                        <select th:field="*{soilType}" id="soilType">
                            <option value="" selected="">Select</option>
                            <option th:each="soilType : ${soilTypes}"
                                    th:value="${soilType.name}" th:text="${soilType.name}">
                            </option>
                        </select>
                        <span id="error-soilType" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>PPB No<span class="astrick">*</span></label>
                        <input type="text" name="" th:field="*{ppbNo}" id="ppbNo">
                        <span id="error-ppbNo" class="error"></span>
                    </div>

                    <div class="form-input">
                        <label>PPB</label>
                        <input type="file" name="ppb_doc" id="ppb_doc">
                        <span id="error-ppb-doc" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label> Is Soil Test Done?</label>
                        <input th:field="*{soilTested}" type="radio" name="Soil" value="Yes"> Yes
                        <input type="radio" th:field="*{soilTested}" name="Soil" value="No"> No
                    </div>
                </div>
                <div class="content-field">

                    <img src="assets/img/why.jpg" th:src="@{/img/why.jpg}"
                         style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 160px;">
                </div>
                <button type="button" onclick="showFieldset('3')" style="clear: both;float: left;">Next <i
                        class="fa-solid fa-chevron-right"></i></button>
                <button class="previous action-button-previous" type="button" onclick="showFieldset('2')"><i
                        class="fa-solid fa-chevron-left"></i>Back
                </button>

            </fieldset>
            <fieldset id="3" style="display:none">

                <div class="form-field">
                    <h2>Current Crop Details</h2>
                    <div class="form-input">
                        <label> Survey No(s)<span class="astrick">*</span></label>
                        <input th:field="*{currentCropSurveyNos}" type="text" name="" id="surveyNos">
                        <span id="error-survey-nos" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Name of the crops grown<span class="astrick">*</span></label>
                        <select th:field="*{currentCrop}" id="currentCrop">
                            <option selected value="">Select</option>
                            <option th:each="crop : ${crops}"
                                    th:value="${crop.name}" th:text="${crop.name}">
                            </option>
                        </select>
                        <span id="error-current-crop" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Total Land Holding (Acres)<span class="astrick">*</span></label>
                        <input type="text" name="" th:field="*{totalLandHoldingInAcres}" id="totalLandHoldingInAcres">
                        <span id="error-total-land-holding-acres" class="error"></span>
                    </div>

                    <div class="form-input">
                        <label>Net Income<span class="astrick">*</span></label>
                        <input type="text" name="" th:field="*{netIncome}" id="netIncomeFarmer">
                        <span id="error-net-income-farmer" class="error"></span>
                    </div>

                </div>
                <div class="content-field">

                    <img src="assets/img/why.jpg" th:src="@{/img/why.jpg}"
                         style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 80px;">
                </div>
                <button type="button" onclick="showFieldset('4')">Next <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button class="previous action-button-previous" type="button" onclick="showFieldset('3')"><i
                        class="fa-solid fa-chevron-left"></i>Back
                </button>

            </fieldset>
            <fieldset id="4" style="display:none">

                <div class="form-field">
                    <h2>Oil Palm Proposed Area Crop Details</h2>
                    <div class="form-input">
                        <label> Survey No(s)<span class="astrick">*</span></label>
                        <input th:field="*{proposedAreaSurveyNos}" type="text" name="" id="proposedSurveyNos">
                        <span id="error-proposed-survey-nos" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Proposed Area(Acres)<span class="astrick">*</span></label>
                        <input th:field="*{proposedAreaInAcres}" type="number" name="" id="proposedAreaInAcres">
                        <span id="error-proposed-acres" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>Method of Plantation<span class="astrick">*</span></label>
                        <select id="plantationType" name="plantationType" th:field="*{plantationMethod}"
                                onchange="populateDetails()">
                            <option selected value="">Select</option>
                            <option value="square">Square</option>
                            <option value="triangle">Triangle</option>
                        </select>
                        <span id="error-plantation-type" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label>No of Plants Per Acre<span class="astrick">*</span></label>
                        <input th:field="*{plantsPerAcre}" type="number" id="plantsPerAcre" name="" readonly="readonly">
                        <span id="error-plants-per-acre" class="error"></span>
                    </div>

                    <div class="form-input">
                        <label>Total Oil Palm Plants<span class="astrick">*</span></label>
                        <input th:field="*{totalPlants}" id="totalPlants" type="number" name="" readonly="readonly">
                        <span id="error-total-plants" class="error"></span>
                    </div>


                </div>
                <div class="content-field">

                    <img src="assets/img/why.jpg" th:src="@{/img/why.jpg}"
                         style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 150px;">
                </div>
                <button type="button" onclick="showFieldset('5')">Next <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button type="button" class="previous action-button-previous" onclick="showFieldset('4')"><i
                        class="fa-solid fa-chevron-left"></i>Back
                </button>


            </fieldset>
            <fieldset id="5" style="display:none">

                <div class="form-field">
                    <h2>Irrigation Details</h2>
                    <div class="form-input">
                        <label>Water Source<span class="astrick">*</span></label>
                        <select th:field="*{waterSource}" id="waterSource">
                            <option value="">Select</option>
                            <option value="borewell">Borewell</option>
                            <option value="open well">Open Well</option>
                            <option value="canal">Canal</option>
                            <option value="tank">Tank</option>
                            <option value="river">River</option>
                            <option value="drip">Drip</option>
                        </select>
                        <span id="error-water-source" class="error"></span>
                    </div>
                    <div class="form-input">
                        <label> Borewell wise Discharge in LPH</label>
                        <input th:field="*{normalDischarge}" type="text" name="">
                    </div>
                    <div class="form-input">
                        <label>Discharge during Summer Months (March to May)</label>
                        <input th:field="*{summerDischarge}" type="text" name="">
                    </div>

                    <div class="form-input">
                        <label>Borewell location (long/lati)</label>
                        <input th:field="*{location}" type="text" name="">
                    </div>
                </div>
                <div class="content-field">

                    <img src="assets/img/why.jpg" th:src="@{/img/why.jpg}"
                         style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 85px;">
                </div>
                <button type="button" onclick="showFieldset('6')">Next <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button type="button" class="previous action-button-previous" onclick="showFieldset('5')"><i
                        class="fa-solid fa-chevron-left"></i>Back
                </button>

            </fieldset>
            <fieldset id="6" style="display:none">

                <div class="form-field">
                    <h2>Bank Details</h2>

                    <div class="form-input">
                        <label> Bank Name</label>
                        <input th:field="*{bankName}" type="text" name="">
                    </div>
                    <div class="form-input">
                        <label>Branch Name </label>
                        <input th:field="*{branchName}" type="text" name="">
                    </div>

                    <div class="form-input">
                        <label>Account Number</label>
                        <input th:field="*{accountNumber}" type="number" name="">
                    </div>
                    <div class="form-input">
                        <label>IFSC Code</label>
                        <input th:field="*{ifscCode}" type="text" name="">
                    </div>
                </div>
                <div class="content-field">

                    <img src="assets/img/why.jpg" th:src="@{/img/why.jpg}"
                         style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 85px;">
                </div>
                <button type="button" onclick="showFieldset('7')">Next <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button class="previous action-button-previous" type="button" onclick="showFieldset('6')"><i
                        class="fa-solid fa-chevron-left"></i>Back
                </button>


            </fieldset>
            <fieldset class="farmer-form-btn" id="7" style="display:none">

                <div class="form-field">
                    <h2>Supporting Documents</h2>

                    <div class="form-input">
                        <label class="astrick"> Aadhaar Card</label>
                        <input type="file" name="aadhar_doc" id="aadhar_doc" th:ignore-validation
                               accept=".pdf,.jpg,.jpeg,.png"
                               multiple>
                        <span id="aadhar_file_Message" style="color: red;"></span>
                    </div>
                    <div class="form-input">
                        <label class="astrick"> Pan Card</label>
                        <input type="file" name="pancard_doc" id="pancard_doc" th:ignore-validation
                               accept=".pdf,.jpg,.jpeg,.png">
                        <span id="pancard_file_Message" style="color: red;"></span>
                    </div>
                    <div class="form-input">
                        <label class="astrick"> Bank Passbook</label>
                        <input type="file" name="passbook_doc" id="passbook_doc" th:ignore-validation
                               accept=".pdf,.jpg,.jpeg,.png">
                        <span id="passbook_file_Message" style="color: red;"></span>
                    </div>
                    <div class="form-input">
                        <label class="astrick"> Photograph</label>
                        <input type="file" name="other_doc" id="other_doc" th:ignore-validation multiple
                               accept=".pdf,.jpg,.jpeg,.png">
                        <span id="other_file_Message" style="color: red;"></span>
                    </div>

                </div>
                <div class="content-field">

                    <img src="assets/img/why.jpg" th:src="@{/img/why.jpg}"
                         style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 95px;">
                </div>

                <button type="submit" name="next" class="save-draft action-button" value="Submit" data-bs-toggle="modal"
                        data-bs-target="#save-draft" id="submitButton">Submit<i
                        class="fa-solid fa-chevron-right"></i></button>

                <button class="previous action-button-previous" type="button" , onclick="showFieldset('7')"><i
                        class="fa-solid fa-chevron-left"></i>Back
                </button>

            </fieldset>


        </form>

    </div>


</section>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"
        integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>

<script src="assets/js/main.js" th:src="@{/js/main.js}"></script>
<script type="text/javascript " src="assets/js/form.js" th:src="@{/js/form.js}"></script>
<script type="text/javascript " src="assets/js/dashboard/form.js" th:src="@{/js/dashboard/form.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"
        integrity="sha512-rstIgDs0xPgmG6RX1Aba4KV5cWJbAMcvRCVmglpam9SoHZiUCyQVDdH2LPlxoHtrv17XWblE/V/PP+Tr04hbtA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
  document.getElementById("submitButton").addEventListener("click", function() {
            var maxSizeInBytes = 2 * 1024 * 1024; // 2 MB
            var isValidSize = true;

            function validateFileSize(inputId, messageId) {
                var fileInput = document.getElementById(inputId);
                var messageElement = document.getElementById(messageId);

                if (fileInput.files.length > 0) {
                    var fileSize = fileInput.files[0].size;

                    if (fileSize > maxSizeInBytes) {
                        messageElement.textContent = "File size exceeds the maximum limit of 2 MB.";
                        isValidSize = false;
                    } else {
                        messageElement.textContent = "";
                    }
                }
            }

            validateFileSize("aadhar_doc", "aadhar_file_Message");
            validateFileSize("pancard_doc", "pancard_file_Message");
            validateFileSize("passbook_doc", "passbook_file_Message");
            validateFileSize("other_doc", "other_file_Message");

            if (isValidSize) {
                // File sizes are valid, submit the form
                document.getElementById("farmer_form").submit();
            } else{
                event.preventDefault();
            }
        });


</script>

</body>

</html>
