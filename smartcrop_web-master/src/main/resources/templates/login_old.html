<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>SmartCorp</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

 
  
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&family=Roboto:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet"> 


  <link href="assets/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link href="assets/css/bootstrap-icons.css" th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
  <link href="assets/css/all.min.css" th:href="@{/css/all.min.css}" rel="stylesheet">
  <link href="assets/css/aos.css" th:href="@{/css/aos.css}" rel="stylesheet">
  <link href="assets/css/glightbox.min.css" th:href="@{/css/glightbox.min.css}"  rel="stylesheet">
  <link href="assets/css/swiper-bundle.min.css" th:href="@{/css/swiper-bundle.min.css}" rel="stylesheet">


  <link href="assets/css/main.css" th:href="@{/css/main.css}" rel="stylesheet">
<script src="https://kit.fontawesome.com/383e09e4e5.js" crossorigin="anonymous"></script>
</head>

<body>

<section class="login-page">
  <div class="login-left">
    <div class="login-logo">
      <img src="assets/img/white-logo.png" th:src="@{/img/white-logo.png}" alt="SmartCorp" class="login-logos">
       <img src="assets/img/app.png" th:src="@{/img/app.png}" style="border-radius: 15px;max-width: 80%;margin:auto;margin-top: 16vh;" class="login-image">
    </div>


  </div>


   <div class="login-right">
    <div class="login-form">
      <h2>Login to your account</h2>
      <div th:if="${#request.getParameter('error') == 'true'}"
           style="color:red;margin:10px 0px;">
        Login Failed!!!<br />
        Reason :
        <span th:if="${#session!= null and #session.getAttribute('SPRING_SECURITY_LAST_EXCEPTION') != null}"
              th:utext="${#session.getAttribute('SPRING_SECURITY_LAST_EXCEPTION').message}">
                Static summary
         </span>
      </div>
      <form name='loginForm' th:action="@{/smart_crop_spring_security_check}" method='POST'>
        <label>Email Address</label>
        <input type="username" name="username">
        <label>Password</label>
        <input type="password" name="password">

        <a href="forget-password.html">Forgot your password?</a>
        <button>Login</button>
      </form>
      <h4>Don't have an account yet? <a th:href="@{/register}"> Create One </a> </h4>
    </div>
  </div>
  

</section>

 <!--  <div id="preloader"></div> -->

<script src="https://code.jquery.com/jquery-3.6.4.min.js" integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>

<script src="assets/js/bootstrap.bundle.min.js" th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script src="assets/js/aos.js" th:src="@{/js/aos.js}"></script>
<script src="assets/js/glightbox.min.js" th:src="@{/js/glightbox.min.js}"></script>
<script src="assets/js/isotope.pkgd.min.js" th:src="@{/js/isotope.pkgd.min.js}"></script>
<script src="assets/js/swiper-bundle.min.js" th:src="@{/js/swiper-bundle.min.js}"></script>
<script src="assets/js/purecounter_vanilla.js" th:src="@{/js/purecounter_vanilla.js}"></script>


<script src="assets/js/main.js" th:src="@{/js/main.js}"></script>
<script src="assets/js/main.js" th:src="@{/js/dashboard/form.js}"></script>


</body>

</html>
